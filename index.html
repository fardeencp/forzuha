<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>For Aysha Zuha 💖</title>

  <style>
    :root {
      --bg1: #fff1f6;
      --bg2: #fdf2f8;
      --text: #111827;
      --muted: #6b7280;
      --yes: #ec4899;
      --yes-hover: #db2777;
      font-family: -apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card {
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(14px);
      padding: 44px 34px;
      border-radius: 26px;
      box-shadow: 0 30px 50px rgba(0,0,0,0.08);
      text-align: center;
      width: 90%;
      max-width: 360px;
      transition: transform 0.25s ease;
    }

    .card.pop {
      transform: scale(1.04);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      color: var(--text);
    }

    p {
      margin: 0 0 30px;
      color: var(--muted);
      font-size: 14px;
    }

    .after-yes {
      display: none;
      margin-top: 22px;
      animation: fadeUp 0.6s ease forwards;
    }

    .after-yes .line1 {
      font-size: 16px;
      font-weight: 600;
      color: #ec4899;
    }

    .after-yes .line2 {
      margin-top: 12px;
      font-size: 14px;
      color: #6b7280;
      line-height: 1.5;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .buttons {
      position: relative;
      height: 160px;
      overflow: hidden;
    }

    button {
      border: none;
      padding: 14px 32px;
      border-radius: 999px;
      font-size: 16px;
      position: absolute;
      touch-action: none;
    }

    #yesBtn {
      background: var(--yes);
      color: white;
      left: 50%;
      top: 10px;
      transform: translateX(-50%);
      z-index: 2;
    }

    #yesBtn:active {
      background: var(--yes-hover);
      transform: translateX(-50%) scale(1.08);
    }

    #noBtn {
      background: #e5e7eb;
      color: #374151;
      top: 95px;
      left: 50%;
      transform: translateX(-50%);
      transition: left 0.25s ease, top 0.25s ease;
    }

    .particle {
      position: fixed;
      pointer-events: none;
      font-size: 26px;
      opacity: 0;
      z-index: 100;
    }
  </style>
</head>

<body>
  <div class="card" id="card">
    <h1>Aysha Zuha, will you be my Valentine? 💖</h1>
    <p>Be honest… but your heart already knows 😌</p>

    <div class="buttons">
      <button id="yesBtn">Yes 💕</button>
      <button id="noBtn">No</button>
    </div>

    <div class="after-yes" id="afterYes">
      <div class="line1">I knew you’d say yes 😌💘</div>
      <div class="line2">
        I wish the gargantua pulls the earth's gravity and makes time run slower , when you're with me. I love you Aysha Zuha
      </div>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const container = document.querySelector(".buttons");
    const card = document.getElementById("card");
    const afterYes = document.getElementById("afterYes");

    function moveNoButton() {
      const c = container.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      const safeRadius = 90; // keep away from YES
      let x, y, dist;

      do {
        x = Math.random() * (c.width - b.width);
        y = Math.random() * (c.height - b.height);
        const yesCenterX = c.width / 2;
        const yesCenterY = 25;
        dist = Math.hypot(x - yesCenterX, y - yesCenterY);
      } while (dist < safeRadius);

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    noBtn.addEventListener("touchstart", moveNoButton, { passive: true });
    noBtn.addEventListener("touchmove", moveNoButton, { passive: true });
    noBtn.addEventListener("click", e => {
      e.preventDefault();
      moveNoButton();
    });

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function createHeart(x) {
      const el = document.createElement("div");
      el.className = "particle";
      el.textContent = "💖";
      el.style.left = x + "px";
      el.style.top = "-30px";
      document.body.appendChild(el);

      const duration = rand(2400, 3800);

      el.animate([
        { transform: "translateY(0)", opacity: 0 },
        {
          transform: `translateY(${window.innerHeight + 120}px) rotate(${rand(120,720)}deg)`,
          opacity: 1
        }
      ], {
        duration,
        easing: "ease-out"
      });

      setTimeout(() => el.remove(), duration);
    }

    yesBtn.addEventListener("click", e => {
      const x = e.clientX || window.innerWidth / 2;

      card.classList.add("pop");
      setTimeout(() => card.classList.remove("pop"), 220);

      for (let i = 0; i < 40; i++) {
        setTimeout(() => createHeart(x + rand(-130, 130)), i * 45);
      }

      yesBtn.style.display = "none";
      noBtn.style.display = "none";
      afterYes.style.display = "block";
    });
  </script>
</body>
</html>

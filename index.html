<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Valentine</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
}

body {
  background:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
    url("bg.jpg") center/cover no-repeat;
}

.container {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  text-align: center;
  padding: 24px;
  color: #fff;
}

.question {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  margin-bottom: 32px;
  transition: opacity 0.6s ease;
}

.buttons {
  position: relative;
  width: 240px;
  height: 120px;
  margin: auto;
}

button {
  position: absolute;
  padding: 14px 28px;
  border-radius: 999px;
  border: none;
  font-size: 16px;
  cursor: pointer;
}

#yesBtn {
  left: 50%;
  transform: translateX(-50%);
  background: #ffffff;
  color: #111;
  font-weight: 500;
}

#noBtn {
  background: rgba(255,255,255,0.15);
  color: transparent;
  backdrop-filter: blur(6px);
  left: 50%;
  top: 60px;
  transform: translateX(-50%);
  pointer-events: auto;
}

.popup {
  opacity: 0;
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: rgba(255,255,255,0.85);
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  transition: opacity 1.2s ease;
  pointer-events: none;
}

.popup.show {
  opacity: 1;
}

.hearts, .poppers {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.heart, .pop {
  position: absolute;
  animation: fall linear forwards;
}

.heart {
  font-size: 22px;
}

.pop {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: white;
}

@keyframes fall {
  to {
    transform: translateY(120vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>
<div class="container">
  <div class="card">
    <div class="question" id="question">
      Will you be my Valentine?
    </div>

    <div class="buttons" id="buttons">
      <button id="yesBtn">Yes</button>
      <button id="noBtn" aria-hidden="true">No</button>
    </div>
  </div>
</div>

<div class="popup" id="popup">
  <div>
    I’d still choose you in every universe 🌌<br><br>
    <span style="font-size:22px; opacity:0.85;">This was always you.</span><br><br>
    <span style="font-size:18px; opacity:0.6;">— always yours</span>
  </div>
</div>

<div class="hearts" id="hearts"></div>
<div class="poppers" id="poppers"></div>

<script>
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const popup = document.getElementById('popup');
const question = document.getElementById('question');
const buttons = document.getElementById('buttons');

function moveNoButton(x, y) {
  const maxX = buttons.clientWidth - noBtn.offsetWidth;
  const maxY = buttons.clientHeight - noBtn.offsetHeight;

  const randX = Math.random() * maxX;
  const randY = Math.random() * maxY;

  noBtn.style.left = randX + 'px';
  noBtn.style.top = randY + 'px';
}

['touchstart','mousemove'].forEach(evt => {
  noBtn.addEventListener(evt, e => {
    moveNoButton();
  });
});

yesBtn.addEventListener('click', () => {
  question.style.opacity = '0';
  buttons.style.opacity = '0';

  setTimeout(() => {
    popup.classList.add('show');
    launchHearts();
    launchPoppers();
  }, 700);
});

function launchHearts() {
  for (let i = 0; i < 40; i++) {
    const h = document.createElement('div');
    h.className = 'heart';
    h.innerText = '💖';
    h.style.left = Math.random() * 100 + 'vw';
    h.style.top = '-10vh';
    h.style.animationDuration = (3 + Math.random() * 3) + 's';
    document.getElementById('hearts').appendChild(h);
    setTimeout(() => h.remove(), 6000);
  }
}

function launchPoppers() {
  for (let i = 0; i < 120; i++) {
    const p = document.createElement('div');
    p.className = 'pop';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.top = Math.random() * 20 + 'vh';
    p.style.animationDuration = (2 + Math.random() * 2) + 's';
    document.getElementById('poppers').appendChild(p);
    setTimeout(() => p.remove(), 4000);
  }
}
</script>
</body>
</html>

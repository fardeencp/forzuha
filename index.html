<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>For Aysha Zuha 💖</title>

  <style>
    :root {
      --bg1: #fff1f6;
      --bg2: #fdf2f8;
      --text: #111827;
      --muted: #6b7280;
      --yes: #ec4899;
      --yes-hover: #db2777;
      font-family: -apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(14px);
      padding: 44px 34px;
      border-radius: 26px;
      box-shadow: 0 30px 50px rgba(0,0,0,0.08);
      text-align: center;
      width: 90%;
      max-width: 360px;
      transition: transform 0.25s ease;
    }

    .card.pop {
      transform: scale(1.04);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      color: var(--text);
    }

    p {
      margin: 0 0 30px;
      color: var(--muted);
      font-size: 14px;
    }

    .buttons {
      position: relative;
      height: 160px;
    }

    button {
      border: none;
      padding: 14px 32px;
      border-radius: 999px;
      font-size: 16px;
      position: absolute;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    #yesBtn {
      background: var(--yes);
      color: white;
      left: 50%;
      top: 10px;
      transform: translateX(-50%);
    }

    #yesBtn:active {
      background: var(--yes-hover);
      transform: translateX(-50%) scale(1.06);
    }

    #noBtn {
      background: #e5e7eb;
      color: #374151;
      top: 95px;
      left: 50%;
      transform: translateX(-50%);
      transition: left 0.25s ease, top 0.25s ease;
      outline: none;
    }

    #noBtn:active,
    #noBtn:focus {
      background: #e5e7eb;
    }

    .after-yes {
      display: none;
      margin-top: 8px;
      animation: fadeUp 0.6s ease forwards;
    }

    .bouquet {
      font-size: 42px;
      margin-bottom: 10px;
      animation: scaleIn 0.6s ease forwards;
    }

    .line1 {
      font-size: 16px;
      font-weight: 600;
      color: #ec4899;
    }

    .line2 {
      margin-top: 12px;
      font-size: 14px;
      color: #6b7280;
      line-height: 1.5;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
      animation-delay: 1.4s;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes scaleIn {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>

  <div class="card" id="card">

    <!-- Question -->
    <div id="questionBlock">
      <h1>Aysha Zuha, will you be my Valentine? 💖</h1>
      <p>Be honest… but your heart already knows 😌</p>

      <div class="buttons">
        <button id="yesBtn">Yes 💕</button>
        <button id="noBtn">No</button>
      </div>
    </div>

    <!-- After YES -->
    <div class="after-yes" id="afterYes">
      <div class="bouquet">🌷💐</div>
      <div class="line1">I knew you’d say yes 😌💘</div>
      <div class="line2">
        I wish the gargantua pulls the earth's gravity and makes time run slower , when you're with me. I love you Aysha Zuha
      </div>
    </div>

  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const container = document.querySelector(".buttons");
    const card = document.getElementById("card");
    const afterYes = document.getElementById("afterYes");
    const questionBlock = document.getElementById("questionBlock");

    function moveNoButton() {
      const c = container.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      const maxX = c.width - b.width;
      const maxY = c.height - b.height;
      const safeRadius = 90;

      let x, y, dist;
      do {
        x = Math.random() * maxX;
        y = Math.random() * maxY;
        dist = Math.hypot(x - c.width / 2, y - 20);
      } while (dist < safeRadius);

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    noBtn.addEventListener("touchstart", moveNoButton, { passive: true });
    noBtn.addEventListener("touchmove", moveNoButton, { passive: true });
    noBtn.addEventListener("click", e => {
      e.preventDefault();
      moveNoButton();
    });

    yesBtn.addEventListener("click", () => {
      card.classList.add("pop");
      setTimeout(() => card.classList.remove("pop"), 220);

      questionBlock.style.display = "none";
      afterYes.style.display = "block";
    });
  </script>

</body>
</html>

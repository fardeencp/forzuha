<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>For Aysha Zuha 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">

<style>
:root{
  --bg1:#fff1f6;
  --bg2:#fdf2f8;
  --text:#111827;
  --muted:#6b7280;
  --pink:#ec4899;
}

*{box-sizing:border-box}

html,body{
  height:100%;
  margin:0;
}

body{
  background:linear-gradient(180deg,var(--bg1),var(--bg2));
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
}

.card{
  background:rgba(255,255,255,0.94);
  padding:48px 34px;
  border-radius:28px;
  box-shadow:0 30px 50px rgba(0,0,0,0.08);
  width:90%;
  max-width:360px;
  text-align:center;
  position:relative;
  z-index:2;
}

h1{
  font-family:'Playfair Display',serif;
  font-size:26px;
  line-height:1.25;
  margin-bottom:14px;
}

p{
  font-size:14px;
  color:var(--muted);
}

.buttons{
  position:relative;
  height:170px;
  margin-top:26px;
}

button{
  border:none;
  padding:14px 34px;
  border-radius:999px;
  font-size:16px;
  position:absolute;
  font-family:'Inter',sans-serif;
  -webkit-tap-highlight-color:transparent;
  transition:left .25s ease, top .25s ease;
}

#yesBtn{
  background:var(--pink);
  color:white;
  left:50%;
  top:10px;
  transform:translateX(-50%);
  z-index:2;
}

#noBtn{
  background:#e5e7eb

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Will you be my Valentine?</title>

  <style>
    :root {
      --bg1: #fff1f6;
      --bg2: #fdf2f8;
      --text: #111827;
      --muted: #6b7280;
      --yes: #ec4899;
      --yes-hover: #db2777;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card {
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(10px);
      padding: 40px 32px;
      border-radius: 22px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 360px;
      width: 90%;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      color: var(--text);
    }

    p {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 14px;
    }

    .buttons {
      position: relative;
      height: 120px;
    }

    button {
      border: none;
      padding: 12px 26px;
      border-radius: 999px;
      font-size: 16px;
      cursor: pointer;
      position: absolute;
      transition: transform 0.2s ease;
    }

    #yesBtn {
      background: var(--yes);
      color: white;
      left: 50%;
      transform: translateX(-50%);
    }

    #yesBtn:hover {
      background: var(--yes-hover);
      transform: translateX(-50%) scale(1.05);
    }

    #noBtn {
      background: #e5e7eb;
      color: #374151;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
    }

    .particle {
      position: fixed;
      pointer-events: none;
      font-size: 24px;
      opacity: 0;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Will you be my Valentine? 💖</h1>
    <p>I promise lots of smiles and sweet moments.</p>

    <div class="buttons">
      <button id="yesBtn">Yes 💕</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");

    function moveNoButton() {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 100);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    noBtn.addEventListener("mouseenter", moveNoButton);
    noBtn.addEventListener("touchstart", moveNoButton);

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function createHeart(x) {
      const el = document.createElement("div");
      el.className = "particle";
      el.textContent = "💖";
      el.style.left = x + "px";
      el.style.top = "-30px";
      document.body.appendChild(el);

      const duration = rand(2000, 3500);

      el.animate([
        { transform: "translateY(0)", opacity: 0 },
        { transform: `translateY(${window.innerHeight + 100}px) rotate(${rand(90,720)}deg)`, opacity: 1 }
      ], {
        duration,
        easing: "ease-out"
      });

      setTimeout(() => el.remove(), duration);
    }

    yesBtn.addEventListener("click", (e) => {
      const x = e.clientX || window.innerWidth / 2;
      for (let i = 0; i < 30; i++) {
        setTimeout(() => createHeart(x + rand(-100, 100)), i * 40);
      }
      yesBtn.textContent = "Yay! 💘";
    });
  </script>
</body>
</html>

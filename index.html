<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>For Her 🤍</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
}

body {
  background: url("bg.jpg") center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* CARD */
.card {
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(10px);
  border-radius: 26px;
  padding: 36px 28px;
  width: 90%;
  max-width: 360px;
  text-align: center;
  box-shadow: 0 25px 45px rgba(0,0,0,0.12);
}

/* QUESTION */
.question {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  color: #0f172a;
  margin-bottom: 10px;
}

.sub {
  font-size: 14px;
  color: #475569;
  margin-bottom: 28px;
}

/* BUTTONS */
.buttons {
  position: relative;
  height: 130px;
}

button {
  position: absolute;
  padding: 14px 32px;
  border-radius: 999px;
  background: white;
  border: 2px solid #1e3a8a; /* dark blue */
  color: #1e3a8a;            /* dark blue text */
  font-size: 16px;
  font-weight: 500;
}

/* YES */
#yesBtn {
  left: 50%;
  transform: translateX(-50%);
}

#yesBtn:active {
  transform: translateX(-50%) scale(1.06);
  background: #eff6ff; /* very light blue press */
}

/* NO */
#noBtn {
  left: 50%;
  top: 70px;
  transform: translateX(-50%);
}

/* AFTER YES */
.popup {
  display: none;
  animation: fadeIn 1.2s ease forwards;
}

.bouquet {
  font-size: 42px;
  margin-bottom: 12px;
}

.easter {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  color: #1e3a8a;
  margin-bottom: 8px;
}

.final-line {
  font-size: 16px;
  color: #334155;
  margin-bottom: 12px;
}

.signature {
  font-size: 14px;
  color: #94a3b8;
}

/* EFFECTS */
.hearts, .poppers {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

.heart, .pop {
  position: absolute;
  animation: fall linear forwards;
}

.heart {
  font-size: 22px;
}

.pop {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #1e3a8a;
}

@keyframes fall {
  to {
    transform: translateY(120vh) rotate(360deg);
    opacity: 0;
  }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="card">

  <!-- QUESTION -->
  <div id="questionBlock">
    <div class="question">Will you be my Valentine?</div>
    <div class="sub">Be honest… but your heart already knows 😌</div>

    <div class="buttons" id="buttons">
      <button id="yesBtn">Yes 💙</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <!-- AFTER YES -->
  <div class="popup" id="popup">
    <div class="bouquet">🌷💐</div>
    <div class="easter">I’d still choose you in every universe 🌌</div>
    <div class="final-line">This was always you.</div>
    <div class="signature">— always yours</div>
  </div>

</div>

<div class="hearts" id="hearts"></div>
<div class="poppers" id="poppers"></div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const buttons = document.getElementById("buttons");
const popup = document.getElementById("popup");
const questionBlock = document.getElementById("questionBlock");

function moveNo() {
  const maxX = buttons.clientWidth - noBtn.offsetWidth;
  const maxY = buttons.clientHeight - noBtn.offsetHeight;

  noBtn.style.left = Math.random() * maxX + "px";
  noBtn.style.top = Math.random() * maxY + "px";
}

["touchstart", "mousemove"].forEach(evt => {
  noBtn.addEventListener(evt, moveNo);
});

yesBtn.addEventListener("click", () => {
  questionBlock.style.display = "none";
  popup.style.display = "block";
  launchHearts();
  launchPoppers();
});

function launchHearts() {
  for (let i = 0; i < 36; i++) {
    const h = document.createElement("div");
    h.className = "heart";
    h.innerText = "💙";
    h.style.left = Math.random() * 100 + "vw";
    h.style.animationDuration = 3 + Math.random() * 3 + "s";
    document.getElementById("hearts").appendChild(h);
    setTimeout(() => h.remove(), 6000);
  }
}

function launchPoppers() {
  for (let i = 0; i < 100; i++) {
    const p = document.createElement("div");
    p.className = "pop";
    p.style.left = Math.random() * 100 + "vw";
    p.style.top = Math.random() * 20 + "vh";
    p.style.animationDuration = 2 + Math.random() * 2 + "s";
    document.getElementById("poppers").appendChild(p);
    setTimeout(() => p.remove(), 4000);
  }
}
</script>

</body>
</html>

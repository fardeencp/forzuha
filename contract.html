<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contract Signing 💌</title>
<style>
body {
  margin:0;
  font-family: 'Poppins', sans-serif;
  background:#fff0f6;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
  flex-direction:column;
}
.contract-card {
  background: rgba(255,255,255,0.96);
  padding: 30px;
  border-radius: 26px;
  width: 90%;
  max-width: 400px;
  text-align: center;
  box-shadow:0 25px 45px rgba(0,0,0,0.12);
}
h1 {
  font-family:'Playfair Display', serif;
  font-size:22px;
  color:#1e3a8a;
  margin-bottom:12px;
}
p {
  color:#475569;
  font-size:15px;
  margin-bottom:20px;
}
canvas {
  border:2px dashed #1e3a8a;
  border-radius:10px;
  touch-action: none;
  width:100%;
  height:200px;
  margin-bottom:10px;
}
button {
  padding:10px 20px;
  border-radius:999px;
  border:none;
  background:#1e3a8a;
  color:white;
  font-weight:600;
  font-size:14px;
  cursor:pointer;
}
.terms {
  font-size:9px;
  color:#94a3b8;
  margin-top:10px;
}
</style>
</head>
<body>

<div class="contract-card">
  <h1>💌 Contract Signing 💌</h1>
  <p>You are Fardeen’s Valentine for the next 60 years 💖</p>
  
  <canvas id="sigCanvas"></canvas>
  <button id="clearBtn">Clear</button>
  
  <div class="terms">*Contract renewal after 60 years</div>
</div>

<script>
const canvas = document.getElementById('sigCanvas');
const ctx = canvas.getContext('2d');
let drawing = false;

function resizeCanvas() {
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Drawing logic
canvas.addEventListener('pointerdown', e => { drawing=true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); });
canvas.addEventListener('pointermove', e => { if(!drawing) return; ctx.lineTo(e.offsetX,e.offsetY); ctx.strokeStyle='#1e3a8a'; ctx.lineWidth=2; ctx.stroke(); });
canvas.addEventListener('pointerup', ()=>drawing=false);
canvas.addEventListener('pointerleave', ()=>drawing=false);

// Clear button
document.getElementById('clearBtn').addEventListener('click',()=>ctx.clearRect(0,0,canvas.width,canvas.height));
</script>

</body>
</html>

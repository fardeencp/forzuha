<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fardeen's Valentine Contract</title>
<style>
:root{
  --text:#111827;
  --muted:#6b7280;
  --border:#1e3a8a;
  font-family:-apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background: url('bg.jpg') center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.card{
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(14px);
  padding:40px 30px;
  border-radius:20px;
  width:90%;
  max-width:400px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,0.1);
}
h1{margin-bottom:12px;font-size:22px;color:var(--border);}
p{margin-bottom:20px;color:var(--text);font-size:14px;line-height:1.5;}
canvas{
  border:1px solid var(--border);
  border-radius:10px;
  touch-action: none;
  width:100%;
  height:200px;
  display:block;
  margin-bottom:16px;
}
button{
  background: var(--border);
  color:white;
  border:none;
  padding:12px 24px;
  border-radius:999px;
  font-size:16px;
  cursor:pointer;
}
button:active{transform:scale(0.96);}
.terms{font-size:10px;color:#475569;margin-top:8px;}
.thankyou{display:none;color:var(--border);font-weight:600;margin-top:12px;}
</style>
</head>
<body>

<div class="card">
  <h1>Valentine Contract 💌</h1>
  <p>
    By signing below, you agree to be <strong>Fardeen's Valentine</strong> for the next <strong>60 years</strong>.
  </p>
  <canvas id="signCanvas"></canvas>
  <button id="submitBtn">Sign & Submit 💖</button>
  <div class="thankyou" id="thankYou">Thank you! Contract signed successfully 😘</div>
  <div class="terms">
    Terms & Conditions: Contract renewal after 60 years.
  </div>
</div>

<script>
const canvas = document.getElementById("signCanvas");
const ctx = canvas.getContext("2d");
let drawing=false;

function resizeCanvas(){
  canvas.width=canvas.offsetWidth;
  canvas.height=canvas.offsetHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Draw logic
canvas.addEventListener("mousedown",()=>drawing=true);
canvas.addEventListener("mouseup",()=>drawing=false);
canvas.addEventListener("mouseleave",()=>drawing=false);
canvas.addEventListener("mousemove",(e)=>{
  if(!drawing) return;
  const rect = canvas.getBoundingClientRect();
  ctx.lineWidth=2;
  ctx.lineCap="round";
  ctx.strokeStyle="#1e3a8a";
  ctx.beginPath();
  ctx.moveTo(e.offsetX,e.offsetY);
  ctx.lineTo(e.offsetX,e.offsetY);
  ctx.stroke();
});

canvas.addEventListener("touchstart",(e)=>{
  drawing=true;
  e.preventDefault();
});
canvas.addEventListener("touchend",(e)=>{drawing=false;e.preventDefault();});
canvas.addEventListener("touchmove",(e)=>{
  if(!drawing) return;
  const touch = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  ctx.lineWidth=2;
  ctx.lineCap="round";
  ctx.strokeStyle="#1e3a8a";
  ctx.beginPath();
  ctx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
  ctx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
  ctx.stroke();
  e.preventDefault();
});

// Submit
document.getElementById("submitBtn").addEventListener("click",()=>{
  document.getElementById("thankYou").style.display="block";
});
</script>

</body>
</html>

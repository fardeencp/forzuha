<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Contract</title>

<!-- Premium Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --text:#111827;
  --muted:#6b7280;
  --border:#1e3a8a;
  font-family: 'Poppins', 'Playfair Display', -apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background: url('bg.jpg') center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.card{
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(14px);
  padding:40px 30px;
  border-radius:20px;
  width:90%;
  max-width:400px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,0.1);
}
h1{margin-bottom:12px;font-size:22px;color:var(--border);}
p{margin-bottom:20px;color:var(--text);font-size:14px;line-height:1.5;}
canvas{
  border:1px solid var(--border);
  border-radius:10px;
  touch-action:none;
  width:100%;
  height:200px;
  display:block;
  margin-bottom:16px;
}
button{
  background: var(--border);
  color:white;
  border:none;
  padding:12px 24px;
  border-radius:999px;
  font-size:16px;
  cursor:pointer;
}
button:active{transform:scale(0.96);}
.terms{font-size:10px;color:#475569;margin-top:8px;}
.thankyou{display:none;color:var(--border);font-weight:600;margin-top:12px;}
</style>
</head>
<body>

<div class="card">
  <h1>Valentine Contract 💌</h1>
  <p>
    By signing below, you agree to be <strong>Fardeen's Valentine</strong> for the next <strong>60 years</strong>.
  </p>
  <canvas id="signCanvas"></canvas>
  <button id="submitBtn">Sign & Submit 💖</button>
  <div class="thankyou" id="thankYou">Thank you! Contract signed successfully 😘</div>
  <div class="terms">
    Terms & Conditions: Contract renewal after 60 years.
  </div>
</div>

<script>
const canvas = document.getElementById("signCanvas");
const ctx = canvas.getContext("2d");
let drawing=false;

// Resize canvas
function resizeCanvas(){canvas.width=canvas.offsetWidth;canvas.height=canvas.offsetHeight;}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

// Draw helpers
function startDraw(x,y){drawing=true;ctx.beginPath();ctx.moveTo(x,y);}
function draw(x,y){if(!drawing) return; ctx.lineTo(x,y); ctx.strokeStyle="#1e3a8a"; ctx.lineWidth=2; ctx.lineCap="round"; ctx.stroke();}
function endDraw(){drawing=false;}

// Mouse events
canvas.addEventListener("mousedown",(e)=>startDraw(e.offsetX,e.offsetY));
canvas.addEventListener("mousemove",(e)=>draw(e.offsetX,e.offsetY));
canvas.addEventListener("mouseup",endDraw);
canvas.addEventListener("mouseleave",endDraw);

// Touch events for iOS/Android
canvas.addEventListener("touchstart",(e)=>{
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];
  startDraw(touch.clientX - rect.left, touch.clientY - rect.top);
});
canvas.addEventListener("touchmove",(e)=>{
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];
  draw(touch.clientX - rect.left, touch.clientY - rect.top);
});
canvas.addEventListener("touchend",(e)=>{e.preventDefault(); endDraw();});

// Submit
document.getElementById("submitBtn").addEventListener("click",()=>{
  document.getElementById("thankYou").style.display="block";
});
</script>

</body>
</html>
